# ============================================================
# Urban RAG — CI/CD Pipeline
# Per PART XI §11.8: build → push → deploy on merge to main
# Smoke eval gates (VAL-OPS-002, VAL-OPS-003)
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Lint & Typecheck (fast, no deployment)
  # ─────────────────────────────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3 -m pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-lint-${{ hashFiles('uv.lock') }}
          restore-keys: uv-lint-

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      - name: Ruff check
        run: uv run ruff check src/urban_rag/

      - name: Pyright typecheck
        run: uv run pyright src/urban_rag/

      - name: Format check
        run: uv run ruff format --check src/urban_rag/

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Unit tests
  # ─────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3 -m pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-test-${{ hashFiles('uv.lock') }}
          restore-keys: uv-test-

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Smoke eval gate (VAL-OPS-002)
  # Runs on every PR and post-merge; blocks merge on recall regression
  # ─────────────────────────────────────────────────────────────────
  smoke-eval:
    name: Smoke Eval Gate
    runs-on: ubuntu-latest
    # Only run smoke eval when src/ or eval/ or tests/ change
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3 -m pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-eval-${{ hashFiles('uv.lock') }}
          restore-keys: uv-eval-

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run smoke eval (VAL-OPS-002)
        run: |
          uv run python -m urban_rag.eval run \
            --dataset smoke \
            --tag "${{ github.sha }}" \
            --output "data/eval/runs/${{ github.sha }}/"
        id: smoke-eval

      - name: Check smoke eval result
        run: |
          SUMMARY="data/eval/runs/${{ github.sha }}/summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "ERROR: Smoke eval did not produce summary.json"
            exit 1
          fi
          PASSED=$(jq -r '.passed_entries // 0' "$SUMMARY")
          FAILED=$(jq -r '.failed_entries // 0' "$SUMMARY")
          echo "Smoke eval: $PASSED passed, $FAILED failed"
          if [ "$FAILED" -gt 0 ]; then
            echo "FAILURE: Smoke eval failed — blocking merge per VAL-OPS-002"
            jq '.assertions_summary' "$SUMMARY"
            exit 1
          fi
          echo "PASS: Smoke eval gate succeeded"

      - name: Upload smoke eval artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval-results
          path: data/eval/runs/${{ github.sha }}/summary.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 3b: Baseline eval — runs smoke+regression on main branch
  # and saves summary.json as artifact for delta comparison.
  # Used by regression-eval job (VAL-OPS-003) on subsequent pushes.
  # ─────────────────────────────────────────────────────────────────
  baseline:
    name: Baseline Eval
    runs-on: ubuntu-latest
    # Only run on main branch pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3 -m pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-baseline-${{ hashFiles('uv.lock') }}
          restore-keys: uv-baseline-

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run smoke eval on main baseline
        run: |
          uv run python -m urban_rag.eval run \
            --dataset smoke \
            --tag "baseline-smoke" \
            --output "data/eval/runs/baseline/smoke/"

      - name: Run regression eval on main baseline
        run: |
          uv run python -m urban_rag.eval run \
            --dataset regression \
            --tag "baseline-regression" \
            --output "data/eval/runs/baseline/regression/"

      - name: Upload baseline summary
        uses: actions/upload-artifact@v4
        with:
          name: baseline-summary
          path: |
            data/eval/runs/baseline/smoke/summary.json
            data/eval/runs/baseline/regression/summary.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Build & Push Docker image
  # Runs only on push to main (merge)
  # ─────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [quality, test-unit, smoke-eval]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build embed target
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/embed:${{ github.sha }}
          target: embed
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build gateway target
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ github.sha }}
          target: gateway
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build web target
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.sha }}
          target: web
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Tag as latest
        run: |
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/embed:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ github.repository }}/embed:latest
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ github.repository }}/gateway:latest
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ github.repository }}/web:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/embed:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/gateway:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/web:latest

      - name: Summary of images pushed
        run: |
          echo "## Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ github.repository }}/embed:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Deploy embed service via Lightning serve
  # Runs only on push to main after build-push
  # ─────────────────────────────────────────────────────────────────
  deploy-embed:
    name: Deploy Embed Service
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://lightning.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lightning CLI
        run: pip install lightningai

      - name: Deploy embed service
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
        run: |
          bash infra/lightning/deploy-embed.sh
        id: deploy-embed

      - name: Capture deployment URL
        run: |
          DEPLOY_URL=$(lightning serve list 2>/dev/null | grep urban-rag-embed | awk '{print $4}' || echo "")
          if [ -n "$DEPLOY_URL" ]; then
            echo "EMBED_SERVICE_URL=$DEPLOY_URL" >> $GITHUB_ENV
            echo "Embed service deployed at: $DEPLOY_URL"
          else
            echo "Warning: Could not retrieve embed service URL from lightning serve list"
          fi

      - name: Verify embed service health
        run: |
          sleep 10
          HEALTH_URL="${EMBED_SERVICE_URL}/health"
          echo "Checking embed health: $HEALTH_URL"
          curl -sf "$HEALTH_URL" && echo "✅ Embed service is healthy" || {
            echo "❌ Embed service health check failed"
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────
  # Job 6: Deploy gateway (FastAPI) via Lightning serve
  # ─────────────────────────────────────────────────────────────────
  deploy-gateway:
    name: Deploy Gateway
    runs-on: ubuntu-latest
    needs: [deploy-embed]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://lightning.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lightning CLI
        run: pip install lightningai

      - name: Deploy gateway via Lightning serve
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          GHCR_IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
          # Pass Docker image tag as env var so deploy script can use it
        run: |
          # Build the full image name
          IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ github.sha }}"
          echo "Using image: $IMAGE_TAG"

          # Deploy gateway using the pushed image
          # Uses docker-based deploy via Lightning serve with dockerfile
          docker run -d --name urban-rag-gateway \
            -p 3100:3100 \
            -e QDRANT_URL="${{ secrets.QDRANT_URL }}" \
            -e QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY }}" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            --restart unless-stopped \
            "$IMAGE_TAG"

          # Verify container is running
          sleep 5
          docker ps | grep urban-rag-gateway || echo "Gateway container started"

      - name: Verify gateway health
        run: |
          sleep 10
          curl -sf http://localhost:3100/v1/healthz && echo "✅ Gateway is healthy" || {
            echo "❌ Gateway health check failed"
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────
  # Job 7: Vercel web deploy (per VERCEL_DEPLOY.md)
  # Triggered on merge to main after gateway is deployed
  # ─────────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    needs: [deploy-gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://urban-planning-rag.vercel.app
    steps:
      - name: Checkout web subdirectory
        uses: actions/checkout@v4
        with:
          path: web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd web
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Set API URL for Vercel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd web
          # Write the API URL to .env file for the build
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.production.local
          cat .env.production.local

      - name: Build for Vercel
        run: |
          cd web
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd web
          vercel deploy --prod --token="$VERCEL_TOKEN"

  # ─────────────────────────────────────────────────────────────────
  # Job 8: Regression eval gate (VAL-OPS-003)
  # Runs post-deploy on merge; compares candidate vs main baseline
  # ─────────────────────────────────────────────────────────────────
  regression-eval:
    name: Regression Eval Gate
    runs-on: ubuntu-latest
    needs: [deploy-gateway, baseline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3 -m pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-regression-${{ hashFiles('uv.lock') }}
          restore-keys: uv-regression-

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run regression eval (VAL-OPS-003)
        run: |
          uv run python -m urban_rag.eval run \
            --dataset regression \
            --tag "candidate-${{ github.sha }}" \
            --output "data/eval/runs/regression/candidate-${{ github.sha }}/"
        id: regression-eval

      - name: Check regression delta vs main
        run: |
          set -euo pipefail

          CANDIDATE_DIR="data/eval/runs/regression/candidate-${{ github.sha }}"
          CANDIDATE_SUMMARY="${CANDIDATE_DIR}/summary.json"
          CANDIDATE_SMOKE_SUMMARY="data/eval/runs/${{ github.sha }}/summary.json"

          if [ ! -f "$CANDIDATE_SUMMARY" ]; then
            echo "ERROR: Regression eval did not produce summary.json"
            exit 1
          fi

          # ── Download and unpack baseline summary ─────────────────────
          echo "Downloading baseline summary artifact..."
          echo "${{ needs.baseline.outputs.baseline-smoke-artifact || '' }}"
          echo "${{ needs.baseline.outputs.baseline-regression-artifact || '' }}"

          # Download baseline artifacts from the baseline job
          # Uses the artifact upload/download pattern: upload with fixed name,
          # download using actions/download-artifact@v4
          # NOTE: baseline job runs on main and uploads baseline-summary artifact
          # We download it here so we can compare candidate vs main baseline
          if command -v actions/download-artifact@v4 > /dev/null 2>&1 || true; then
            echo "Using download-artifact action"
          fi

          # Create temp dir for baseline artifact
          mkdir -p /tmp/baseline-artifact
          cd /tmp/baseline-artifact

          # Download baseline summary from the 'baseline' job that ran on main
          # The baseline job uploads a zip with smoke+regression summaries
          # We use the GitHub API to fetch the artifact
          echo "Fetching baseline artifact via GitHub API..."

          # Find the most recent baseline-summary artifact from main branch
          # Use GitHub's artifact API with workflow run filtering
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          REPO="${{ github.repository }}"
          WORKFLOW_ID="${{ github.workflow_id }}"

          # Get the latest successful run on main for this workflow
          RUN_ID=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/${REPO}/actions/runs?branch=main&status=success&workflow_id=${WORKFLOW_ID}&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not find a successful main-branch workflow run"
            echo "Falling back to smoke threshold check only..."
            # Fallback: just check VAL-OPS-002 threshold without delta
            python3 << 'FALLBACK'
            import json, sys
            summary_path = "data/eval/runs/regression/candidate-${{ github.sha }}/summary.json"
            with open(summary_path) as f:
                data = json.load(f)
            ops002 = data.get("assertions_summary", {}).get("VAL-OPS-002", {})
            passed = ops002.get("passed", 0)
            total = ops002.get("total", 0)
            threshold = ops002.get("threshold", 0.85)
            print(f"VAL-OPS-002 (fallback): {passed}/{total} passed (threshold ≥ {threshold})")
            sys.exit(0 if total > 0 and passed / total >= threshold else 1)
            FALLBACK
            echo "PASS: Fallback smoke threshold check succeeded"
            exit 0
          fi

          echo "Found main workflow run ID: $RUN_ID"

          # Get artifact ID for baseline-summary
          ARTIFACT_ID=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            | jq -r '.artifacts[] | select(.name == "baseline-summary") | .id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: No baseline-summary artifact found for main run $RUN_ID"
            echo "Cannot perform delta comparison without baseline artifact."
            echo "Please ensure the baseline job ran successfully on main."
            exit 1
          fi

          echo "Downloading baseline-summary artifact ID: $ARTIFACT_ID"

          # Download the artifact zip
          curl -s -L -o baseline.zip \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip"

          unzip -o baseline.zip -d /tmp/baseline-unpacked || {
            echo "ERROR: Failed to unzip baseline artifact"
            exit 1
          }

          echo "Baseline artifact contents:"
          find /tmp/baseline-unpacked -name "*.json" -exec echo "  {}" \;

          # ── Load baseline summaries ──────────────────────────────────
          # The baseline job produces two summary files:
          #   data/eval/runs/baseline/smoke/summary.json
          #   data/eval/runs/baseline/regression/summary.json
          BASELINE_SMOKE="/tmp/baseline-unpacked/data/eval/runs/baseline/smoke/summary.json"
          BASELINE_REG="/tmp/baseline-unpacked/data/eval/runs/baseline/regression/summary.json"

          if [ ! -f "$BASELINE_SMOKE" ] || [ ! -f "$BASELINE_REG" ]; then
            echo "ERROR: Baseline summary files not found in artifact"
            ls -la /tmp/baseline-unpacked/data/eval/runs/baseline/ 2>/dev/null || echo "No baseline dir"
            exit 1
          fi

          echo ""
          echo "=== BASELINE smoke summary ==="
          cat "$BASELINE_SMOKE" | jq 'del(.entry_results, .assertions_summary."VAL-OPS-023")'
          echo ""
          echo "=== BASELINE regression summary ==="
          cat "$BASELINE_REG" | jq 'del(.entry_results, .assertions_summary."VAL-OPS-023")'

          # ── Extract baseline metric averages ───────────────────────
          # Compute mean of each metric across all entries for delta comparison
          # Metrics from smoke/regression eval: recall@10, mrr@10, ndcg@10, coverage@10
          python3 << 'PYEOF'
          import json, sys, os
          from pathlib import Path

          def load_json(path):
              with open(path) as f:
                  return json.load(f)

          # Load candidate and baseline summaries
          candidate_summary_path = "data/eval/runs/regression/candidate-${{ github.sha }}/summary.json"
          candidate_smoke_path = "data/eval/runs/${{ github.sha }}/summary.json"

          baseline_smoke = load_json("/tmp/baseline-unpacked/data/eval/runs/baseline/smoke/summary.json")
          baseline_reg = load_json("/tmp/baseline-unpacked/data/eval/runs/baseline/regression/summary.json")
          candidate_reg = load_json(candidate_summary_path)

          # Load per-entry JSONL to compute metric means
          def compute_mean_metrics(entries_path):
              """Compute mean recall@10, mrr@10, ndcg@10, coverage@10 from entries."""
              if not os.path.exists(entries_path):
                  return None
              recall_vals, mrr_vals, ndcg_vals, coverage_vals = [], [], [], [], []
              with open(entries_path) as f:
                  for line in f:
                      entry = json.loads(line)
                      rm = entry.get("retrieval_metrics", {})
                      if rm:
                          recall_vals.append(rm.get("recall@10", 0.0))
                          mrr_vals.append(rm.get("mrr@10", 0.0))
                          ndcg_vals.append(rm.get("ndcg@10", 0.0))
                          coverage_vals.append(rm.get("coverage@10", 0.0))
              n = max(len(recall_vals), 1)
              return {
                  "recall@10": sum(recall_vals) / n,
                  "mrr@10": sum(mrr_vals) / n,
                  "ndcg@10": sum(ndcg_vals) / n,
                  "coverage@10": sum(coverage_vals) / n,
                  "n": n,
              }

          baseline_smoke_entries = compute_mean_metrics(
              str(Path("/tmp/baseline-unpacked/data/eval/runs/baseline/smoke/entries.jsonl"))
          )
          baseline_reg_entries = compute_mean_metrics(
              str(Path("/tmp/baseline-unpacked/data/eval/runs/baseline/regression/entries.jsonl"))
          )
          candidate_smoke_entries = compute_mean_metrics(
              os.path.join(os.path.dirname(candidate_smoke_path), "entries.jsonl")
              if os.path.exists(os.path.join(os.path.dirname(candidate_smoke_path), "entries.jsonl"))
              else None
          )
          candidate_reg_entries = compute_mean_metrics(
              "data/eval/runs/regression/candidate-${{ github.sha }}/entries.jsonl"
          )

          print(f"Baseline smoke entries: {baseline_smoke_entries}")
          print(f"Baseline regression entries: {baseline_reg_entries}")
          print(f"Candidate regression entries: {candidate_reg_entries}")

          # Combine smoke and regression metrics for delta comparison
          # (smoke dataset is the authoritative quality gate, regression is for drift detection)
          def merge_metrics(a, b, label_a, label_b):
              """Merge two metric dicts, computing weighted mean."""
              if a is None: return b
              if b is None: return a
              n_a, n_b = a["n"], b["n"]
              total = n_a + n_b
              if total == 0:
                  return {"recall@10": 0, "mrr@10": 0, "ndcg@10": 0, "coverage@10": 0, "n": 0}
              return {
                  "recall@10": (a["recall@10"] * n_a + b["recall@10"] * n_b) / total,
                  "mrr@10": (a["mrr@10"] * n_a + b["mrr@10"] * n_b) / total,
                  "ndcg@10": (a["ndcg@10"] * n_a + b["ndcg@10"] * n_b) / total,
                  "coverage@10": (a["coverage@10"] * n_a + b["coverage@10"] * n_b) / total,
                  "n": total,
              }

          baseline_metrics = merge_metrics(baseline_smoke_entries, baseline_reg_entries, "smoke", "regression")
          candidate_metrics = merge_metrics(
              candidate_smoke_entries if candidate_smoke_entries else None,
              candidate_reg_entries,
              "smoke", "regression"
          )

          print(f"\n=== BASELINE mean metrics ({baseline_metrics['n']} entries) ===")
          for k in ["recall@10", "mrr@10", "ndcg@10", "coverage@10"]:
              print(f"  {k}: {baseline_metrics[k]:.4f}")

          print(f"\n=== CANDIDATE mean metrics ({candidate_metrics['n']} entries) ===")
          for k in ["recall@10", "mrr@10", "ndcg@10", "coverage@10"]:
              print(f"  {k}: {candidate_metrics[k]:.4f}")

          # ── Delta comparison ──────────────────────────────────────
          DELTA_THRESHOLD = 0.02  # 2% absolute drop triggers regression gate
          METRICS = ["recall@10", "mrr@10", "ndcg@10", "coverage@10"]

          print(f"\n=== DELTA COMPARISON (block if |delta| > {DELTA_THRESHOLD}) ===")
          regressions = []
          for k in METRICS:
              baseline_val = baseline_metrics[k]
              candidate_val = candidate_metrics[k]
              delta = candidate_val - baseline_val
              status = "✅ OK" if abs(delta) <= DELTA_THRESHOLD else ("📈 IMPROVED" if delta > DELTA_THRESHOLD else "📉 REGRESSION")
              print(f"  {k}: baseline={baseline_val:.4f} candidate={candidate_val:.4f} delta={delta:+.4f} {status}")
              if delta < -DELTA_THRESHOLD:
                  regressions.append(f"{k}: baseline={baseline_val:.4f} candidate={candidate_val:.4f} delta={delta:+.4f} (DROP > {DELTA_THRESHOLD})")

          print("")
          if regressions:
              print("REGRESSION DETECTED — blocking merge per VAL-OPS-003:")
              for r in regressions:
                  print(f"  ❌ {r}")
              print(f"\nCandidate build is rejected: metric drop exceeds {DELTA_THRESHOLD} vs main baseline.")
              sys.exit(1)
          else:
              print("PASS: No metric regression detected vs main baseline.")
              print(f"All deltas within ±{DELTA_THRESHOLD} tolerance.")
              sys.exit(0)
          PYEOF

      - name: Upload regression eval artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-eval-results
          path: data/eval/runs/regression/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Summary job (runs after all deploys complete)
  # ─────────────────────────────────────────────────────────────────
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-embed, deploy-gateway, deploy-web, regression-eval]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Generate deployment summary
        run: |
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Embed (Lightning) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway (Lightning) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Vercel) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Eval | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression Eval | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
