# Prometheus alert rules for Urban Planning RAG
# Per VAL-OPS-010, VAL-OPS-011, VAL-OPS-018, VAL-OPS-022
#
# P0: 5xx > 1% for 5 min → page on-call
# P1: faithfulness < 0.80 for 1 hour → ticket + Slack
# P2: cost/query 24h-rolling > $0.05 → ticket
# P3: embed cold-start > 60s → ticket

groups:
  - name: urban_rag_operational
    rules:
      # VAL-OPS-010: P0 alert — 5xx error rate > 1% for 5 minutes
      # Uses http_status label on query_total (5xx = 500, 502, 503, 504, etc.)
      - alert: UrbanRagHighErrorRate
        expr: |
          (
            sum(rate(query_total{http_status=~"5.."}[5m]))
            /
            sum(rate(query_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          tier: gateway
          priority: P0
        annotations:
          summary: "High 5xx error rate on Urban RAG gateway"
          description: "5xx error rate is {{ $value | humanizePercentage }} (threshold: 1%) for 5 minutes."
          runbook_url: "docs/runbooks/high_error_rate.md"

      # VAL-OPS-011: P1 alert — faithfulness < 0.80 for 1 hour
      # faithfulness_p50 is updated by background eval job
      - alert: UrbanRagLowFaithfulness
        expr: faithfulness_p50 < 0.80
        for: 1h
        labels:
          severity: warning
          tier: quality
          priority: P1
        annotations:
          summary: "Low faithfulness score on Urban RAG"
          description: "Faithfulness p50 is {{ $value }} (threshold: 0.80) for 1 hour. Generate a quality ticket."
          runbook_url: "docs/runbooks/low_faithfulness.md"

      # VAL-OPS-018: P2 alert — cost per query 24h-rolling > $0.05
      - alert: UrbanRagHighQueryCost
        expr: |
          (sum(rate(cost_usd_total[24h])) / sum(rate(query_total[24h]))) > 0.05
        for: 10m
        labels:
          severity: warning
          tier: gateway
          priority: P2
        annotations:
          summary: "High cost per query on Urban RAG"
          description: "Cost per query is ${{ $value | humanize }} (threshold: $0.05) sustained for 10 minutes. 24h rolling average."
          runbook_url: "docs/runbooks/high_cost.md"

      # VAL-OPS-022: P3 alert — embed service cold-start > 60s rolling average
      - alert: UrbanRagEmbedColdStart
        expr: |
          histogram_quantile(0.50, sum(rate(embed_cold_start_seconds_bucket[5m])) by (le)) > 60
        for: 5m
        labels:
          severity: warning
          tier: infrastructure
          priority: P3
        annotations:
          summary: "Slow embed service cold-start"
          description: "Embed service cold-start p50 is {{ $value }}s (threshold: 60s). Generate an infrastructure ticket."
          runbook_url: "docs/runbooks/embed_cold_start.md"

      # VAL-OPS-020: Scrape target health
      - alert: UrbanRagTargetDown
        expr: up{job=~"urban-rag-.*"} == 0
        for: 2m
        labels:
          severity: critical
          tier: infrastructure
        annotations:
          summary: "Prometheus scrape target is down"
          description: "Scrape target {{ $labels.job }} has been down for 2 minutes."
          runbook_url: "docs/runbooks/scrape_target_down.md"

  - name: urban_rag_latency
    rules:
      # p95 query latency > 10s
      - alert: UrbanRagHighLatency
        expr: histogram_quantile(0.95, sum(rate(query_latency_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
          tier: gateway
        annotations:
          summary: "High query latency on Urban RAG"
          description: "p95 query latency is {{ $value }}s (threshold: 10s) for 5 minutes."
          runbook_url: "docs/runbooks/high_latency.md"

  - name: urban_rag_retrieval
    rules:
      # Qdrant retrieval latency p95 > 2s per channel
      - alert: UrbanRagQdrantHighLatency
        expr: histogram_quantile(0.95, sum(rate(qdrant_latency_seconds_bucket[5m])) by (le, channel)) > 2
        for: 5m
        labels:
          severity: warning
          tier: retrieval
        annotations:
          summary: "High Qdrant retrieval latency for channel {{ $labels.channel }}"
          description: "p95 Qdrant latency for {{ $labels.channel }} is {{ $value }}s (threshold: 2s)."
          runbook_url: "docs/runbooks/qdrant_high_latency.md"
