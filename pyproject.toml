[project]
name = "urban-rag"
version = "0.1.0"
description = "Visual RAG system for Indian urban planning regulations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Tanmay Choudhary" }
]
keywords = ["rag", "visual-retrieval", "urban-planning", "document-understanding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "colpali-engine>=0.3.0",
    "qdrant-client>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.7.0",
    "structlog>=25.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "docling>=2.0.0",
    "marker-pdf>=1.0.0",
    "pymupdf>=1.25.0",
    "ragas>=0.4.0",
    "litellm>=1.0.0",
    "langfuse>=2.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[project.scripts]
urban-rag = "urban_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_rag"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/PLAN.md",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
