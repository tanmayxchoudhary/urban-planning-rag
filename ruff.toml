src = ["src"]
target-version = "py312"
line-length = 100
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-truism
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101",   # assert (fine for tests)
    "FBT001", # boolean default positional arg (FBT002 ignore too but FBT001 still fires on rebuild/skip_eval/use_rerank in Typer CLI commands)
    "FBT002", # boolean default positional arg (required for Typer CLI options)
    "FBT003", # boolean default arg (sometimes needed)
    "N802",   # method name with CAPS (sometimes needed for enum-like)
    "N803",   # argument with CAPS (sometimes needed)
    "SIM108", # ternary if simplified (readability)
    "RET505", # else with return (sometimes clearer)
    "BLE001", # blind-except (intentional for parse fallback - we catch everything from parsers)
    "ARG001", # unused type: ignore comments on parse.py (temporary during development)
]

[lint.isort]
known-first-party = ["urban_rag"]
